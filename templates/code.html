<figure class="doc-code doc-code-{{langClass}}" data-lang="{{lang}}">
<figcaption class="doc-code-bar">{{{title}}}<button type="button" class="doc-code-copy" data-copy>Copy</button></figcaption>
<pre class="doc-code-pre"><code class="doc-code-source">{{{code}}}</code></pre>
</figure>
<template data-part="title"><span class="doc-code-title">{{text}}</span></template>
